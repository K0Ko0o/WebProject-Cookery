{% extends 'shared/base.html' %}
{% load crispy_forms_filters %}
{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm p-4">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <a href="{% url 'ingredient:create' %}" class="btn-create">Can't find the ingredient you need? Click here to add it!</a>
                        <button type="submit" class="btn btn-primary w-100 mt-3">Create Ingredient</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
