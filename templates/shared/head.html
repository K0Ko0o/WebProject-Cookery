<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Table - Minimalist & Delicious Recipes</title>
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* ================= RESET & BASICS ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #2d3748;
            background-color: #faf9f6;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* ================= CONTAINER ================= */
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ================= HEADER / NAVBAR ================= */
        .header {
            background-color: #ffffff;
            border-bottom: 1px solid #edf2f7;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a202c;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #e53e3e;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.95rem;
            font-weight: 500;
            color: #4a5568;
            transition: color 0.2s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #e53e3e;
        }

        /* Mobile Menu Toggle Button */
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #2d3748;
        }

        /* ================= HERO SECTION ================= */
        .hero {
            padding: 60px 0 50px;
            text-align: center;
            background-color: #ffffff;
            border-bottom: 1px solid #edf2f7;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: #718096;
            max-width: 550px;
            margin: 0 auto 30px;
            font-weight: 400;
        }

        /* Search Bar */
        .search-form {
            display: flex;
            max-width: 500px;
            margin: 0 auto;
            border: 1px solid #cbd5e0;
            border-radius: 30px;
            overflow: hidden;
            background-color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
            transition: border-color 0.2s ease;
        }

        .search-form:focus-within {
            border-color: #e53e3e;
        }

        .search-input {
            flex: 1;
            padding: 14px 20px;
            border: none;
            outline: none;
            font-size: 0.95rem;
            color: #2d3748;
        }

        .search-button {
            background-color: #e53e3e;
            color: #ffffff;
            border: none;
            padding: 0 24px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .search-button:hover {
            background-color: #c53030;
        }

        /* ================= FEATURED RECIPES SECTION ================= */
        .main-content {
            flex: 1;
            padding: 50px 0;
        }

        .section-header {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a202c;
        }

        /* Recipe Grid Layout */
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 28px;
        }

        /* Recipe Card */
        .recipe-card {
            background-color: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .recipe-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .recipe-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #edf2f7;
        }

        .recipe-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .recipe-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .recipe-desc {
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 20px;
            flex: 1;
        }

        .recipe-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 14px;
            border-top: 1px solid #edf2f7;
        }

        .cook-time {
            font-size: 0.85rem;
            color: #a0aec0;
            font-weight: 500;
        }

        .btn-view {
            font-size: 0.85rem;
            font-weight: 600;
            color: #e53e3e;
            padding: 6px 12px;
            border-radius: 6px;
            background-color: #fff5f5;
            transition: background-color 0.2s ease;
        }

        .btn-view:hover {
            background-color: #fed7d7;
        }

        /* ================= FOOTER ================= */
        .footer {
            background-color: #ffffff;
            border-top: 1px solid #edf2f7;
            padding: 30px 0;
            margin-top: auto;
        }

        .footer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-align: center;
        }

        .footer-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .footer-links a {
            font-size: 0.85rem;
            color: #718096;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: #2d3748;
        }

        .copyright {
            font-size: 0.85rem;
            color: #a0aec0;
        }

        /* ================= RESPONSIVE STYLES ================= */
        @media (max-width: 640px) {
            .hero-title {
                font-size: 1.8rem;
            }

            .hero-subtitle {
                font-size: 0.95rem;
            }

            .mobile-toggle {
                display: block;
            }

            .nav-links {
                display: none;
                width: 100%;
                flex-direction: column;
                position: absolute;
                top: 70px;
                left: 0;
                background-color: #ffffff;
                border-bottom: 1px solid #edf2f7;
                padding: 16px 20px;
                gap: 16px;
            }

            .nav-links.show {
                display: flex;
            }

            .search-form {
                flex-direction: column;
                border-radius: 12px;
            }

            .search-button {
                padding: 12px;
                width: 100%;
            }
        }
    </style>
</head>
